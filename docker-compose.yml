# Runs this API next to the database started by the nexorarent repo's own
# docker-compose.yml (MySQL on 127.0.0.1:3307). Start that first, then:
#   docker compose up --build
# Values come from .env (copy .env.example).
services:
  api:
    build: .
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3307}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
