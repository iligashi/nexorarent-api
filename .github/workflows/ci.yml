name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Integration tests must run against MySQL here, never skip.
      REQUIRE_DOCKER: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NexoraRent.slnx

      - name: Build
        run: dotnet build NexoraRent.slnx --no-restore -c Release

      - name: Test (unit + MySQL integration)
        run: dotnet test --solution NexoraRent.slnx --no-build -c Release

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nexorarent-api:ci .
